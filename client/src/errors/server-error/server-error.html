<div class="card bg-base-100 w-2/3 mx-auto p-8 mt-24 shadow-xl">
  <h1 class="text-2xl font-semibold text-error mb-4">Server Error</h1>
  @if (error) {
    <h2 class="text-lg mb-4">{{ error.message }}</h2>
    @if (error.details) {
      <div class="rounded-box bg-base-200 p-4 overflow-auto">
        <code class="text-sm whitespace-pre-wrap">{{ error.details }}</code>
      </div>
    }
  } @else {
    <h2 class="text-lg">There was an error.</h2>
  }
  <a routerLink="/" class="btn mt-6 w-fit">Back home</a>
</div>
