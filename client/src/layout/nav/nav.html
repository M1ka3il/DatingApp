<header class ="p-3 w-full fixed top-0 z-50 bg-gradient-to-r from-neutral to-[#4a1d4f] shadow-lg">
<div class="flex align-middle items-center px-10 mx-auto gap-6">
  <a routerLink="/" class="flex items-center max-h-16 gap-3 text-white border-r-white/30 border-r-2 pr-6">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="size-7 text-primary">
    <path d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z" />
  </svg>

    <h3 class="text-2xl font-semibold text-white uppercase tracking-wide">Dating App</h3>
  </a>
  <nav class="flex gap-5 my-2 uppercase text-lg text-white/80">
    <a routerLink="/members" routerLinkActive="!text-white border-b-2 border-primary" class="hover:text-white transition-colors">Matches</a>
    <a class="hover:text-white transition-colors">Lists</a>
    @if (loggedIn()) {
      <a routerLink="/messages" routerLinkActive="!text-white border-b-2 border-primary" class="hover:text-white transition-colors">Messages</a>
    }
  </nav>
  <div class="flex align-middle ml-auto gap-3">
    @if(loggedIn()){
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button"
        class="flex items-center text-white text-xl gap-3 cursor-pointer">
          <img [src]="accountService.currentUser()?.imageUrl || '/male_defaultAvatar_vecteezy.jpg'" alt="User Avatar" class="w-8 h-8 rounded-full object-cover">
          <span>{{ accountService.currentUser()?.userName }}</span>
        </div>
        <ul tabindex="-1" class="dropdown-content  menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
          <li><a>Edit Profile</a></li>
          <li><a (click)="logout()">Logout</a></li>
        </ul>
      </div>
    } @else {
  <form #loginForm="ngForm" (ngSubmit)="login()" class="flex items-center gap-3">
      <input
        [(ngModel)]="creds.email"
        name="email"
        type="text"
        class ="input"
        placeholder="Email">
      <input 
        [(ngModel)]="creds.password" 
        type="password" 
        name="password"
        class ="input" 
        placeholder="Password">
      <button type="submit" class="btn">Login</button>
      <a routerLink="/register" class="btn btn-primary">Register</a>
    </form>   
    }
    </div>
</div>
</header>
