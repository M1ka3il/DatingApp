<div class="card bg-base-100 w-1/2 mx-auto p-10 mt-24 shadow-xl">
  <ul class="list">
    @for(member of members(); track member.id) {
      <li class="list-row items-center">
        <a [routerLink]="['/members', member.id]" class="flex items-center gap-4 w-full">
          <img [src]="member.imageUrl || '/male_defaultAvatar_vecteezy.jpg'" alt="user avatar" class="size-12 rounded-box">
          <div>
            {{member.userName}}
          </div>
        </a>
      </li>
    }
  </ul>
</div>
